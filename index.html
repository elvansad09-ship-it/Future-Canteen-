<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#174f3b">
  <meta name="description" content="FutureCanteen — pesan jajanan kantin sekolah dengan mudah dan kurangi antrean.">
  <title>FutureCanteen — Kantin Sekolah Digital</title>
  <style>
    :root{--green:#174f3b;--green2:#205b43;--lime:#d7e8a5;--bg:#f5f7f1;--muted:#78847b;--line:#e1e7df;--white:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:#20372c;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input{font:inherit}.wrap{max-width:1050px;margin:auto;padding:24px}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:4px 0 26px;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:14px}.logo{width:64px;height:64px;display:grid;place-items:center;background:var(--green);color:white;border-radius:22px;font-size:30px}
    h1{font-size:28px;letter-spacing:-1.2px;margin:0}.tagline{margin:4px 0 0;color:var(--muted)}
    .switch{background:#e8eee4;padding:7px;border-radius:18px;display:flex;gap:5px}.switch button,.tabs button,.filters button{border:0;cursor:pointer;font-weight:700;color:#66746a;background:transparent;border-radius:13px;padding:13px 18px}
    .switch button.active,.filters button.active{background:white;color:var(--green);box-shadow:0 3px 12px #183b2910}
    .school{color:var(--muted);margin:20px 0 28px}.hero{background:var(--green);color:white;border-radius:38px;padding:48px 42px;margin:0 0 38px}
    .eyebrow{color:var(--lime);font-size:14px;letter-spacing:3px;font-weight:800}.hero h2{font-size:clamp(32px,5vw,54px);line-height:1.12;letter-spacing:-2px;max-width:650px;margin:26px 0}.hero h2 span{color:var(--lime)}.hero p{font-size:18px;color:#dce9df;margin:0}
    .tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:38px;overflow:auto}.tabs button{white-space:nowrap;border-radius:0;padding:18px 12px;border-bottom:3px solid transparent}.tabs button.active{color:var(--green);border-bottom-color:var(--green)}
    h3{font-size:34px;letter-spacing:-1.2px;margin:0 0 8px}.sub{color:var(--muted);margin:0 0 24px;font-size:17px}
    .search{width:100%;border:1px solid var(--line);border-radius:20px;padding:18px 22px;background:white;margin-bottom:18px;outline-color:var(--green)}
    .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:32px}.filters button{background:#e8eee4;border-radius:30px;padding:13px 20px}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.item{background:white;border:1px solid var(--line);border-radius:24px;overflow:hidden}.food-art{height:175px;background:linear-gradient(135deg,#edf4e5,#dcebd2);display:grid;place-items:center;font-size:76px;position:relative}.pill{position:absolute;top:14px;left:14px;background:#fff;border-radius:30px;padding:7px 13px;font-size:12px;font-weight:800;color:#526b59}.stock{position:absolute;top:14px;right:14px;background:#fff;border-radius:30px;padding:7px 12px;font-size:12px;color:#526b59}
    .details{padding:18px}.details h4{margin:0 0 7px;font-size:19px}.details p{margin:0 0 16px;color:var(--muted);font-size:14px}.price-row{display:flex;justify-content:space-between;align-items:center;gap:10px}.price{font-weight:800;color:var(--green)}.add{border:0;border-radius:12px;background:var(--green);color:white;padding:10px 14px;font-weight:800;cursor:pointer}.add:disabled{opacity:.4;cursor:not-allowed}
    .empty{grid-column:1/-1;padding:38px;text-align:center;color:var(--muted);background:white;border-radius:20px}.panel{background:white;border:1px solid var(--line);border-radius:24px;padding:24px;margin-top:8px}.order{display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding:14px 0}.order:last-child{border-bottom:0}.muted{color:var(--muted)}.checkout{margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.checkout button{border:0;background:var(--green);color:#fff;border-radius:14px;padding:14px 20px;font-weight:800;cursor:pointer}
    footer{text-align:center;color:var(--muted);font-size:13px;padding:40px 0 14px}
    @media(max-width:760px){.wrap{padding:20px 16px}.hero{padding:34px 25px;border-radius:30px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.food-art{height:135px;font-size:58px}.details{padding:14px}.details h4{font-size:16px}.brand h1{font-size:24px}.logo{width:56px;height:56px}.switch button{padding:11px 13px}}
    @media(max-width:460px){header{align-items:flex-start;flex-direction:column}.switch{align-self:flex-end;margin-top:-8px}.grid{grid-template-columns:1fr 1fr}.hero h2{font-size:35px}.hero p{font-size:16px}.tabs{gap:10px}.tabs button{font-size:14px}}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo" aria-hidden="true">🍴</div><div><h1>FutureCanteen</h1><p class="tagline">Jajan mudah, antrean berkurang!</p></div></div>
    <div class="switch" aria-label="Pilih peran"><button class="active" id="studentMode">Siswa</button><button id="sellerMode">Penjual</button></div>
  </header>
  <p class="school">🏫 Kantin Sekolah</p>
  <section class="hero"><div class="eyebrow">KANTIN SEKOLAH DIGITAL</div><h2>Jajan favoritmu,<br><span>tanpa antre lama.</span></h2><p>Pilih menu, pesan sekarang, lalu ambil saat siap.</p></section>
  <nav class="tabs" aria-label="Navigasi"><button class="active" data-tab="menu">⌂ &nbsp;Menu</button><button data-tab="cart">🛍️ &nbsp;Keranjang (<span id="cartCount">0</span>)</button><button data-tab="orders">▤ &nbsp;Pesanan</button></nav>
  <main id="mainContent"></main>
  <footer>© 2026 FutureCanteen · Dibuat oleh Elvan</footer>
</div>
<script>
const products=[
 {id:1,name:"Nasi Goreng",desc:"Nasi goreng spesial kantin",price:12000,stock:15,category:"Makanan",emoji:"🍛"},
 {id:2,name:"Mie Goreng",desc:"Mie goreng gurih dan nikmat",price:10000,stock:12,category:"Makanan",emoji:"🍜"},
 {id:3,name:"Ayam Geprek",desc:"Ayam crispy dengan sambal",price:15000,stock:10,category:"Makanan",emoji:"🍗"},
 {id:4,name:"Roti Cokelat",desc:"Roti lembut isi cokelat",price:6000,stock:20,category:"Snack",emoji:"🥐"},
 {id:5,name:"Es Teh Manis",desc:"Minuman segar dingin",price:4000,stock:25,category:"Minuman",emoji:"🧋"},
 {id:6,name:"Jus Jeruk",desc:"Jus jeruk segar",price:8000,stock:10,category:"Minuman",emoji:"🍹"}
];
let cart={},orders=[],category="Semua",tab="menu",mode="student",search="";
const rupiah=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n);
function render(){
 document.getElementById("cartCount").textContent=Object.values(cart).reduce((a,b)=>a+b,0);
 const main=document.getElementById("mainContent");
 if(tab==="menu"){
  main.innerHTML=`<h3>${mode==="seller"?"Kelola menu kantin":"Menu kantin"}</h3><p class="sub">${mode==="seller"?"Ringkasan menu dan stok yang tersedia.":"Pilih yang kamu suka hari ini."}</p><input class="search" id="search" placeholder="⌕  Cari makanan atau minuman..." value="${search.replaceAll('"','&quot;')}"><div class="filters">${["Semua","Makanan","Minuman","Snack"].map(c=>`<button class="${category===c?"active":""}" data-cat="${c}">${c}</button>`).join("")}</div><div class="grid" id="productGrid"></div>`;
  document.getElementById("search").addEventListener("input",e=>{search=e.target.value;renderProducts()});
  main.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{category=b.dataset.cat;render()});
  renderProducts();
 }else if(tab==="cart"){
  const entries=Object.entries(cart).filter(([id,q])=>q>0);
  main.innerHTML=`<h3>Keranjang kamu</h3><p class="sub">Periksa pesanan sebelum checkout.</p><div class="panel">${entries.length?entries.map(([id,q])=>{let p=products.find(x=>x.id==id);return `<div class="order"><div><b>${p.emoji} ${p.name}</b><div class="muted">${rupiah(p.price)} × ${q}</div></div><div><button class="add" data-minus="${id}">−</button> <b>${q}</b> <button class="add" data-plus="${id}">+</button></div></div>`}).join(""):`<p class="muted">Keranjang masih kosong. Yuk pilih menu dulu!</p>`}<div class="checkout"><b>Total: ${rupiah(entries.reduce((s,[id,q])=>s+products.find(p=>p.id==id).price*q,0))}</b><button id="checkout" ${entries.length?"":"disabled"}>Buat pesanan</button></div></div>`;
  main.querySelectorAll("[data-minus]").forEach(b=>b.onclick=()=>{let id=b.dataset.minus;cart[id]--;if(cart[id]<=0)delete cart[id];render()});
  main.querySelectorAll("[data-plus]").forEach(b=>b.onclick=()=>{let id=b.dataset.plus;cart[id]++;render()});
  document.getElementById("checkout").onclick=()=>{if(!entries.length)return;orders.unshift({number:"FC"+Date.now().toString().slice(-6),items:entries.map(([id,q])=>({id:+id,q})),total:entries.reduce((s,[id,q])=>s+products.find(p=>p.id==id).price*q,0),status:"Menunggu diproses"});cart={};tab="orders";render();};
 }else{
  main.innerHTML=`<h3>${mode==="seller"?"Pesanan masuk":"Pesanan saya"}</h3><p class="sub">Status pesanan kamu akan muncul di sini.</p><div class="panel">${orders.length?orders.map(o=>`<div class="order"><div><b>Pesanan #${o.number}</b><div class="muted">${o.items.map(i=>products.find(p=>p.id===i.id).name+" × "+i.q).join(", ")}</div><div class="muted">${o.status}</div></div><b>${rupiah(o.total)}</b></div>`).join(""):`<p class="muted">Belum ada pesanan. Pesanan yang kamu buat akan tampil di sini.</p>`}</div>`;
 }
}
function renderProducts(){
 const grid=document.getElementById("productGrid");if(!grid)return;
 const list=products.filter(p=>(category==="Semua"||p.category===category)&&(p.name+" "+p.desc).toLowerCase().includes(search.toLowerCase()));
 grid.innerHTML=list.length?list.map(p=>`<article class="item"><div class="food-art"><span class="pill">${p.category}</span><span class="stock">Stok ${p.stock}</span>${p.emoji}</div><div class="details"><h4>${p.name}</h4><p>${p.desc}</p><div class="price-row"><span class="price">${rupiah(p.price)}</span>${mode==="seller"?`<span class="muted">Tersedia</span>`:`<button class="add" data-add="${p.id}" ${p.stock===0?"disabled":""}>+ Tambah</button>`}</div></div></article>`).join(""):`<div class="empty">Menu tidak ditemukan.</div>`;
 grid.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{let id=b.dataset.add;cart[id]=(cart[id]||0)+1;render()});
}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));render()});
document.getElementById("studentMode").onclick=()=>{mode="student";document.getElementById("studentMode").classList.add("active");document.getElementById("sellerMode").classList.remove("active");render()};
document.getElementById("sellerMode").onclick=()=>{mode="seller";document.getElementById("sellerMode").classList.add("active");document.getElementById("studentMode").classList.remove("active");render()};
render();
</script>
</body>
</html>
